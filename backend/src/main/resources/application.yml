spring:
  application:
    name: ${APP_NAME:travelit-backend}

  profiles:
    active: ${APP_ENV:dev}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}

ai:
  provider: ${AI_PROVIDER:groq}

  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:qwen/qwen3.8-27b}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
