spring:
  datasource:
    url: jdbc:mysql://localhost:3306/travelit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  error:
    include-message: always

jwt:
  secret: "travelit-dev-secret-key-must-be-at-least-32-characters-long"
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
